name: SportBuddy quality gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate server JavaScript syntax
        run: |
          find api -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Check TypeScript and build web app
        run: npm run build
      - name: Check dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
